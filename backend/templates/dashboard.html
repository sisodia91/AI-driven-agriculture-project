<!DOCTYPE html>
<html>
<head>
    <title>Smart Agriculture Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 32px;
        }

        h2 {
            margin: 30px 0 10px;
            font-weight: 500;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: rgba(0, 255, 140, 0.7);
            color: black;
        }

        tr:nth-child(even) {
            background: rgba(255,255,255,0.05);
        }

        tr:hover {
            background: rgba(0,255,140,0.2);
            transition: 0.3s;
        }

        canvas {
            background: white;
            border-radius: 10px;
            padding: 10px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(45deg, #00ff87, #60efff);
            color: black;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,255,140,0.4);
        }

        .result {
            margin-top: 15px;
            font-size: 16px;
            line-height: 1.5;
        }

        @media(max-width: 768px) {
            h1 {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌱 Smart Agriculture Dashboard</h1>

    <!-- TABLE -->
    <div class="card">
        <h2>📋 Sensor History</h2>
        <table>
            <thead>
                <tr>
                    <th>Sr No</th>
                    <th>Temperature</th>
                    <th>Humidity</th>
                    <th>Soil</th>
                    <th>Health</th>
                    <th>Dry Time (hrs)</th>
                    <th>Time</th>
                </tr>
            </thead>
            <tbody id="data-table"></tbody>
        </table>
    </div>

    <!-- GRAPH -->
    <div class="card">
        <h2>📊 Farm Data Graph</h2>
        <canvas id="tempChart"></canvas>
    </div>

    <!-- CROP RECOMMENDATION -->
    <div class="card">
        <h2>🌾 Smart Crop Recommendation</h2>
        <button class="btn" onclick="getCrop()">Analyze Farm</button>
        <p id="cropResult" class="result">Click to analyze current farm data..</p>
    </div>

</div>

<div class="card">
    <h2>📁 Export Dataset</h2>
    <button class="btn" onclick="downloadCSV()">Download CSV</button>
</div>

<script>
let chart;

async function loadData() {
    const res = await fetch("/history");
    const data = await res.json();

    const table = document.getElementById("data-table");
    table.innerHTML = "";

    let labels = [];
    let tempData = [];
    let soilData = [];
    let healthData = [];

    data.forEach((item, index) => {
        table.innerHTML += `
            <tr>
                <td>${index + 1}</td>
                <td>${item.temperature}</td>
                <td>${item.humidity}</td>
                <td>${item.soil_moisture}</td>
                <td>${item.health_score}</td>
                <td>${item.prediction}</td>
                <td>${item.timestamp}</td>
            </tr>
        `;

        labels.push(item.timestamp);
        tempData.push(item.temperature);
        soilData.push(item.soil_moisture);
        healthData.push(item.health_score);
    });

    if (chart) chart.destroy();

    const ctx = document.getElementById('tempChart').getContext('2d');

    chart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels.reverse(),
            datasets: [
                { label: 'Temperature', data: tempData.reverse(), borderWidth: 2 },
                { label: 'Soil Moisture', data: soilData.reverse(), borderWidth: 2 },
                { label: 'Health Score', data: healthData.reverse(), borderWidth: 2 }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    labels: { color: 'white' }
                }
            },
            scales: {
                x: { ticks: { color: 'white' } },
                y: { beginAtZero: true, ticks: { color: 'white' } }
            }
        }
    });
}

async function getCrop() {
    try {
        const res = await fetch("/crop");
        const data = await res.json();

        if (data.error) {
            document.getElementById("cropResult").innerText =
                "⚠️ No farm data available yet";
            return;
        }

        document.getElementById("cropResult").innerText =
            `🌡 Temp: ${data.temperature}°C | 💧 Humidity: ${data.humidity}% | 🌱 Soil: ${data.soil}% \n  ${data.recommendation.join("\n ")}`;
    } catch (error) {
        document.getElementById("cropResult").innerText =
            "❌ Error connecting to server";
    }
}
async function init() {
    await loadData();
    await getCrop();
}

function downloadCSV() {
    window.open("/download-csv", "_blank");
}

init();
setInterval(init, 5000);
</script>

</body>
</html>
