</head>

<body>

<div class="container">

<h1>🌱 Smart Agriculture Dashboard</h1>

<!-- LIVE STATS -->

<div class="card stats">
    <div class="stat">🌡 Temp<br><b id="liveTemp">--</b></div>
    <div class="stat">💧 Humidity<br><b id="liveHumidity">--</b></div>
    <div class="stat">🌱 Soil<br><b id="liveSoil">--</b></div>
    <div class="stat">📊 Health<br><b id="liveHealth">--</b></div>
</div>

<!-- MOTOR STATUS -->

<div class="card">
    <h2>🚰 Irrigation Status</h2>
    <p id="motorStatus">Checking...</p>
</div>

<!-- GRAPH -->

<div class="card">
    <h2>📊 Farm Data Graph</h2>
    <p style="font-size:12px;">🔄 Auto-updating every 5 seconds</p>
    <canvas id="chart"></canvas>
</div>

<!-- TABLE -->

<div class="card">
    <h2>📋 Sensor History</h2>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Temp</th>
                <th>Humidity</th>
                <th>Soil</th>
                <th>Health</th>
                <th>Dry Time</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody id="table"></tbody>
    </table>
</div>

<!-- CROP -->

<div class="card">
    <h2>🌾 Crop Recommendation</h2>
    <button class="btn" onclick="getCrop()">Analyze</button>
    <p id="cropResult">Click to analyze...</p>
</div>

</div>

<script>
let chart;

async function loadData() {
    const res = await fetch("/history");
    const data = await res.json();

    let labels=[], temp=[], soil=[], health=[];

    const table = document.getElementById("table");
    table.innerHTML="";

    data.forEach((item,i)=>{
        table.innerHTML+=`
        <tr>
            <td>${i+1}</td>
            <td>${item.temperature}</td>
            <td>${item.humidity}</td>
            <td>${item.soil_moisture}</td>
            <td style="color:${item.health_score>75?'lightgreen':item.health_score>50?'orange':'red'}">
                ${item.health_score}
            </td>
            <td>🌵 ${item.prediction} hrs</td>
            <td>${item.timestamp}</td>
        </tr>`;

        labels.push(item.timestamp);
        temp.push(item.temperature);
        soil.push(item.soil_moisture);
        health.push(item.health_score);
    });

    if(data.length>0){
        let latest=data[data.length-1];

        liveTemp.innerText=latest.temperature;
        liveHumidity.innerText=latest.humidity;
        liveSoil.innerText=latest.soil_moisture;
        liveHealth.innerText=latest.health_score;

        motorStatus.innerText =
            latest.soil_moisture<40 ? "💧 Motor ON" : "🛑 Motor OFF";
    }

    if(chart) chart.destroy();

    chart=new Chart(document.getElementById("chart"),{
        type:'line',
        data:{
            labels:labels.reverse(),
            datasets:[
                {label:'Temperature (°C)',data:temp.reverse(),borderWidth:2,tension:0.4},
                {label:'Soil (%)',data:soil.reverse(),borderWidth:2,tension:0.4},
                {label:'Health (%)',data:health.reverse(),borderWidth:2,tension:0.4}
            ]
        },
        options:{
            plugins:{legend:{labels:{color:'white'}}},
            scales:{
                x:{ticks:{color:'white'}},
                y:{ticks:{color:'white'}}
            }
        }
    });
}

async function getCrop(){
    const res=await fetch("/crop");
    const data=await res.json();
    cropResult.innerText=data.recommendation.join("\n");
}

setInterval(loadData,5000);
loadData();
</script>

</body>
</html>
